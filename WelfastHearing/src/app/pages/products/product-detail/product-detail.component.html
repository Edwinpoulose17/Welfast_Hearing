<!-- product-detail.component.html -->



<div class="container">


  <!-- Loading State -->
  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading product details...</p>
  </div>

  <!-- Product Detail -->
  <div *ngIf="!loading && product.hasData" class="product-detail">
    <div class="product-content">
      <!-- Product Image -->
      <div class="product-image-section">
        <img
          [src]="product.image || 'https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'"
          [alt]="product.name || 'Product Image'"
          class="product-image"
          (error)="onImageError($event)"
        >
      </div>

      <!-- Product Info -->
      <div class="product-info">
        <h1 class="product-title">{{ product.name }}</h1>

        <p class="product-description">{{ product.description }}</p>

        <div class="call-now-section">
          <button
            class="call-now-btn"
            [class.calling]="isCalling"
            (click)="onCallNow()"
            [disabled]="isCalling"
          >
            <svg
              *ngIf="!isCalling"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path>
            </svg>

            <svg
              *ngIf="isCalling"
              fill="currentColor"
              viewBox="0 0 20 20"
              class="calling-icon"
            >
              <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path>
            </svg>

            {{ isCalling ? 'Calling...' : 'Call Now to Purchase' }}
          </button>

          <!-- <div class="call-info">
            <p>Speak with our hearing specialists</p>
            <span class="phone-number">(555) 123-4567</span>
          </div> -->
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && !product.hasData" class="empty-state">
    <h3>Product Not Found</h3>
    <p>We couldn't find the product you're looking for. Please check the link or browse our products.</p>
    <button class="btn" (click)="goToProducts()">Browse Products</button>
  </div>

  <!-- Contact Section -->

</div>
