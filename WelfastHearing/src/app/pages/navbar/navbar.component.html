<div class="w-100">
  <nav class="navbar navbar-expand-lg d-flex align-items-center">
    <div class="container-fluid">
      <div class="hide">
        <a
          class="navbar-brand me-auto"
          style="width: 100%; height: 100%"
          href="#"
          ><img
            src="../../../assets/Welfast Hearing Branding Kit-08.png"
            style="width: 120px; height: 70px; object-fit: contain"
            alt=""
        /></a>
      </div>

      <div
        class="back offcanvas offcanvas-end"
        style="width: 84%"
        tabindex="-1"
        id="offcanvasNavbar"
        aria-labelledby="offcanvasNavbarLabel"
      >
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasNavbarLabel">
            <img
              src="../../../assets/Welfast Hearing Branding Kit-08.png"
              style="width: 120px; height: 70px; object-fit: contain"
              alt=""
            />
          </h5>
          <button
            type="button"
            style="color: rgb(0, 0, 0)"
            class="btn-close"
            data-bs-dismiss="offcanvas"
            aria-label="Close"
          ></button>
        </div>

        <div class="offcanvas-body">
          <ul
            class="navbar-nav justify-content-center align-items-center flex-grow-1 ml-auto"
          >
            <li class="nav-item">
              <a
                class="nav-link"
                aria-current="page"
                href="#"
                [routerLink]="['']"
                data-bs-dismiss="offcanvas"
                >Home</a
              >
            </li>

            <li class="nav-item">
              <a
                class="nav-link"
                aria-current="page"
                href="#"
                [routerLink]="['/Services']"
                data-bs-dismiss="offcanvas"
                >Services</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="#"
                [routerLink]="['/Hearing-aids']"
                data-bs-dismiss="offcanvas"
                >Products</a
              >
            </li>

            <li class="hidden">
              <a
                class="navbar-brand px-auto"
                style="width: 100%; height: 100%"
                href="#"
              >
                <img
                  src="../../../assets/Welfast Hearing Branding Kit-08.png"
                  style="width: 138px; height: 88px; object-fit: contain"
                  alt=""
              /></a>
            </li>


            <li class="nav-item">
              <a
                class="nav-link"
                href="#"
                [routerLink]="['/about-us']"
                data-bs-dismiss="offcanvas"
                >About Us</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="#"
                [routerLink]="['/Contact-us']"
                data-bs-dismiss="offcanvas"
                >Contact us</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="#"
                [routerLink]="['/FAQ']"
                data-bs-dismiss="offcanvas"
                >FAQ</a
              >
            </li>
          </ul>
        </div>
      </div>

      <button
        class="navbar-toggler pe-0"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#offcanvasNavbar"
        aria-controls="offcanvasNavbar"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>
</div>
