<div style="background-color: var(--ActiveBase);font-family:  Inria Sans, sans-serif;">
  <div class="container py-5">
    <h1 class="text-center text-white mb-5">Services</h1>
    <div class="row mt-4" *ngFor="let service of services; let i = index">
      <div class="col-md-6 my-3" [ngClass]="{'order-md-last': i % 2 !== 0}">
        <img [src]="service.image" class="w-100"
             style="height: 200px; object-fit: cover; border-radius: 15px;"
             [alt]="service.title">
      </div>
      <div class="col-md-6">
        <h2 class="mt-3"><strong>{{ service.title }}</strong></h2>
        <h5>{{ service.showMore ? service.fullText : (service.fullText | slice:0:100) + '...' }}</h5>

        <!-- Additional Points Section -->
        <div *ngIf="service.showMore">
          <div *ngFor="let section of service.subsections">
            <h2 class="mt-2"><strong>{{ section.title }}</strong></h2>
            <h3 *ngIf="section.content">{{ section.content }}</h3>
            <ul *ngIf="section.points">
              <li  *ngFor="let point of section.points">{{ point }}</li>
            </ul>
          </div>
        </div>

        <button class="btn btn-custom mt-2" (click)="toggleReadMore(service)">
          {{ service.showMore ? 'Read Less' : 'Read More' }}
        </button>
      </div>
    </div>
  </div>
</div>
